[project]
name = "fasterrisk"
version = "0.2.0"
description = "Create sparse and accurate risk scoring systems!"
authors = [
    { name = "Jiachang Liu", email = "jiachang.liu@duke.edu" },
    { name = "Chudi Zhong", email = "chudi.zhong@duke.edu" },
    { name = "Boxuan Li", email = "boxuan.li@duke.edu" },
    { name = "Margo Setlzer", email = "mseltzer@cs.ubc.ca" },
    { name = "Cynthia Rudin", email = "cynthia@cs.duke.edu" },
]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "BSD-3-Clause"
maintainers = [{ name = "Jiachang Liu", email = "jiachang.liu@duke.edu" }]
dependencies = [
    "numpy>=2.0.0,<3",
    "scikit-learn==1.4.2",
    "pandas>=2.2.0,<3",
    "requests>=2.28.1,<3",
    "matplotlib>=3.8.0,<4",
    "pillow>=10.1.0,<11",
]

[project.urls]
Homepage = "https://pypi.org/project/fasterrisk/"
Repository = "https://github.com/jiachangliu/FasterRisk"
Documentation = "https://fasterrisk.readthedocs.io/en/latest/"

[project.optional-dependencies]
dev = [
    "pytest>=7.1.3,<8",
    "pytest-cov>=4.0.0,<5",
    "jupyter>=1.0.0,<2",
    "sphinx-autoapi>=2.0.0,<3",
    "sphinx-rtd-theme>=1.0.0,<2",
    "seaborn>=0.12.1,<0.13",
]

[tool.hatch.build.targets.sdist]
include = ["src/fasterrisk"]

[tool.hatch.build.targets.wheel]
include = ["src/fasterrisk"]

[tool.hatch.build.targets.wheel.sources]
"src/fasterrisk" = "fasterrisk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["NPY201"]
